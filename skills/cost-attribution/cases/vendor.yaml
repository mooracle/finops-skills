# Vendor splits (references/saas.md; article Part 5).

cases:

- name: a vendor charge splits by the vendor's breakdown
  given:
    vendor_registry: [{vendor: metrics, publisher_like: "metrics co%"}]
    vendor_lines:
    - {vendor: metrics, workspace: ws-a, servicename: Compute, amount: 60.0}
    - {vendor: metrics, workspace: ws-b, servicename: Storage, amount: 30.0}
    - {vendor: metrics, workspace: null, servicename: Support, amount: 10.0}
    - {vendor: metrics, workspace: ws-c, servicename: Compute, amount: 0.0}
    vendor_fetch: [{vendor: metrics}]
    bill:
    - {subaccountid: acct-m, publishername: Metrics Co, first_party: false, servicename: Metrics Co Cloud,
       chargecategory: Purchase, effectivecost: 1000.0,
       chargeperiodstart: 2026-04-01T00:00:00, chargeperiodend: 2026-05-01T00:00:00}
  expect:
    base_monthly:
      rows:
      - {x_namespace: ws-a, servicename: Compute, subaccountid: acct-m, split_by: "vendor:metrics", effectivecost: 600.0}
      - {x_namespace: ws-b, servicename: Storage, subaccountid: acct-m, split_by: "vendor:metrics", effectivecost: 300.0}
      - {x_namespace: null, servicename: Metrics Co Cloud, subaccountid: acct-m, split_by: "vendor:metrics", effectivecost: 100.0}
    base_daily: {sum: 1000.0}
    report:
      name: vendor_status
      rows: [{vendor: metrics, status: split}]

- name: until the breakdown covers the month, the charge stays whole
  given:
    vendor_registry: [{vendor: metrics, publisher_like: "metrics co%"}]
    vendor_lines: [{vendor: metrics, workspace: ws-a, servicename: Compute, amount: 60.0}]
    vendor_fetch: [{vendor: metrics, through_day: 2026-04-20}]
    bill:
    - {publishername: Metrics Co, first_party: false, chargecategory: Purchase, effectivecost: 1000.0,
       chargeperiodstart: 2026-04-01T00:00:00, chargeperiodend: 2026-05-01T00:00:00}
  expect:
    base_monthly: {rows: [{x_namespace: null, split_by: null, effectivecost: 1000.0}]}
    report: {name: vendor_status, rows: [{vendor: metrics, status: waiting}]}

- name: a negative line leaves the charge whole
  given:
    vendor_registry: [{vendor: metrics, publisher_like: "metrics co%"}]
    vendor_lines:
    - {vendor: metrics, workspace: ws-a, servicename: Compute, amount: 60.0}
    - {vendor: metrics, workspace: ws-b, servicename: Refund, amount: -5.0}
    vendor_fetch: [{vendor: metrics}]
    bill:
    - {publishername: Metrics Co, first_party: false, effectivecost: 1000.0,
       chargeperiodstart: 2026-04-01T00:00:00, chargeperiodend: 2026-05-01T00:00:00}
  expect:
    base_monthly: {rows: [{split_by: null, effectivecost: 1000.0}]}
    report: {name: vendor_status, rows: [{vendor: metrics, status: unusable}]}

- name: a refund inside one workspace's lines still leaves the charge whole
  given:
    vendor_registry: [{vendor: metrics, publisher_like: "metrics co%"}]
    vendor_lines:
    - {vendor: metrics, workspace: ws-a, servicename: Compute, amount: 60.0}
    - {vendor: metrics, workspace: ws-a, servicename: Compute, amount: -5.0}
    - {vendor: metrics, workspace: ws-b, servicename: Compute, amount: 40.0}
    vendor_fetch: [{vendor: metrics}]
    bill:
    - {publishername: Metrics Co, first_party: false, effectivecost: 1000.0,
       chargeperiodstart: 2026-04-01T00:00:00, chargeperiodend: 2026-05-01T00:00:00}
  expect:
    base_monthly: {rows: [{split_by: null, x_namespace: null, effectivecost: 1000.0}]}
    report: {name: vendor_status, rows: [{vendor: metrics, status: unusable}]}

