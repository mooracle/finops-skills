  effectivecost: 10.0
  listcost: 10.0
  currency: USD
  billing_period: "2026-04"
  provider: aws
base_daily: {<<: *base_monthly, dt: 2026-04-07}
rules_lookup: {provider: aws, subaccountid: acct-1, x_resourcegroupname: null, x_namespace: null,
               servicename: null, tag_costcenter: null, subaccountname: null,
               team: null, app: null, environment: null}

